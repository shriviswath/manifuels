name: Deploy ManiFuels to GitHub Pages

on:
  push:
    branches: [main]          # Triggers on every push to main
  workflow_dispatch:           # Also allows manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true    # Cancel any running deploy if a new push comes in

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload site to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'             # Deploy entire repo root (index.html + sw.js + manifest.json)

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
